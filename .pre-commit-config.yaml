repos:
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: poetry run ruff check --fix
        language: system
        pass_filenames: false
      - id: format
        name: format
        entry: poetry run ruff format
        language: system
        pass_filenames: false
      - id: poetry-lock
        name: poetry-lock
        entry: poetry check --lock
        language: system
        pass_filenames: false

