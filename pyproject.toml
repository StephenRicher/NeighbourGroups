[project]
name = "neighbourgroups"
version = "1.1.0"
authors = [
    { name = "Dessislava Veltcheva", email = "bgrdessislava@gmail.com" },
    { name = "Stephen Richer", email = "stephenricher@hotmail.co.uk" },
]
description = "Neighbour Groups"
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  'Intended Audience :: Developers',
  'Natural Language :: English',
  'Programming Language :: Python :: 3',
  "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11,<4.0"

dependencies = [
    "pandas (>=3.0.0,<4.0.0)",
    "numpy (>=2.4.1,<3.0.0)",
    "catboost (>=1.2.8,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "treecluster (>=1.0.5,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "biopython (>=1.86,<2.0)",
    "pyclustering (>=0.10.1.2,<0.11.0.0)",
    "seaborn (>=0.13.2,<0.14.0)"
]

[project.scripts]
"ngroups" = "ngroups.__main__:main"

[tool.poetry]
packages = [{include = "*", from="src"}]

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.14"
pre-commit = "^4.5.1"

[tool.ruff]
src = ["src", "tests"]
line-length = 120
exclude = [".git", "__pycache__", ".poetry"]

[tool.ruff.lint]
select = ["E4", "E501", "E7", "E9", "F", "D", "Q", "I001", "C901", "C90"]
ignore = ["PT011", "W291", "SIM102"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]
